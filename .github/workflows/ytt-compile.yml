name: ytt-compile

# Lightweight compile gate for the fork: builds the `ytt` TUI binary.
# Triggered on pushes to zegon-compile and manually.

on:
  push:
    branches: ["zegon-compile"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  compile:
    name: cargo build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build ytt
        run: cargo build --locked
